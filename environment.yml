# Create the environment with:
#   conda env create -f environment.yml
#   conda activate mtdsim
#
# The simulator itself is installed editable via pip (see pyproject.toml).
# To include the optional reinforcement-learning MTD selector, replace
# "- -e ." with "- -e .[ai]" (adds TensorFlow).
name: mtdsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .[test]
