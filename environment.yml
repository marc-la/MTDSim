# conda env create -f environment.yml && conda activate mtdsim
# Recreates the environment the dissertation's runs used (requirements-lock.txt),
# then installs this repository in editable mode.
name: mtdsim
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - -r requirements-lock.txt
      - -e .
