<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fig:mtdsim-model — the three modules of MTDSim</title>
<style>
  :root {
    --ink:#333;          /* primary strokes, primary labels */
    --ink2:#6e6e6e;      /* secondary labels only */
    --faint:#b0b0b0;     /* faint SEMANTIC content only */
    --chrome:#e6e6e6;    /* panel chrome — fainter than the faintest data */
    --accent:#1f548c;    /* attacker action and path */
  }
  html, body { margin:0; background:#fff; }
  body { width: 900px; }
  @media print { @page { size: 16.06cm 7.67cm; margin:0; } body { width:16.06cm; } svg { width:16.06cm; height:6.35cm; } }
  svg { display:block; font-family: "Nimbus Sans", "TeX Gyre Heros", Helvetica, Arial, sans-serif; }
  text { fill: var(--ink); }
  .title  { font-size: 21px; font-weight: bold; }
  .lbl    { font-size: 17px; }
  .sm     { font-size: 15.5px; fill: var(--ink2); }
  .xref   { font-size: 15.5px; fill: var(--ink2); font-style: italic; }
  .verb   { font-size: 17px; }
  .module { fill:#fff; stroke: var(--ink); stroke-width:1.6; }
  .frame  { fill:none; stroke: var(--chrome); stroke-width:1.4; }
  .band   { fill:#fafafa; stroke: var(--faint); stroke-width:1.3; }
  .wedge  { fill: var(--chrome); stroke:none; }
  .icon   { fill:none; stroke: var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .icon.f { fill: var(--ink); stroke:none; }
  .arrow  { stroke: var(--ink); stroke-width:2.0; fill:none; stroke-linecap:round; }
  .arrow.acc { stroke: var(--accent); stroke-width:2.2; }
  .halo   { paint-order: stroke; stroke:#fff; stroke-width:6px; stroke-linejoin:round; }
  .dot    { fill: var(--ink2); }
</style></head>
<body>
<svg id="fig" viewBox="0 0 900 356" width="900" height="356" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f548c"/></marker>
  <g id="hacker"><path class="icon f" d="M-10,13 C-10,4 -5,-1 0,-1 C5,-1 10,4 10,13 Z"/><path class="icon f" d="M-7,-3 C-7,-12 -4,-15 0,-15 C4,-15 7,-12 7,-3 C5,-4 3,-5 0,-5 C-3,-5 -5,-4 -7,-3 Z"/><path d="M-4,-3 C-2,-1 2,-1 4,-3 C3,0 -3,0 -4,-3 Z" fill="#fff"/></g>
  <g id="netic"><circle class="icon" cx="-9" cy="-6" r="3.6"/><circle class="icon" cx="9" cy="-6" r="3.6"/><circle class="icon" cx="0" cy="9" r="3.6"/><path class="icon" d="M-6,-4.5 L-2.4,7 M6,-4.5 L2.4,7 M-5.4,-6 H5.4"/></g>
  <g id="shieldic"><path class="icon" d="M0,-14 L11,-9 V0 C11,7 6,12 0,14 C-6,12 -11,7 -11,0 V-9 Z"/><path class="icon" d="M-4.5,0 L-1,3.5 L5,-3.5"/></g>
</defs>

<!-- ============ ATTACKER ============ -->
<g id="attacker">
  <rect class="module" x="26" y="30" width="200" height="272" rx="5"/>
  <g transform="translate(54,64)"><use href="#hacker"/></g>
  <text class="title" x="76" y="71">Attacker</text>
  <g class="dot"><circle cx="56" cy="136" r="2.6"/><circle cx="56" cy="196" r="2.6"/></g>
  <text class="lbl" x="72" y="142">what it holds</text>
  <text class="lbl" x="72" y="202">its procedure</text>
  <text class="xref" x="126" y="282" text-anchor="middle">Figure 2.4</text>
</g>

<!-- ============ NETWORK ============ -->
<g id="network">
  <rect class="module" x="356" y="30" width="220" height="272" rx="5"/>
  <g transform="translate(384,62)"><use href="#netic"/></g>
  <text class="title" x="406" y="71">Network</text>
  <path class="wedge" d="M382,148 H550 L516,160 H416 Z"/>
  <path class="wedge" d="M382,208 H550 L516,220 H416 Z"/>
  <rect class="band" x="382" y="100" width="168" height="42" rx="4"/>
  <rect class="band" x="382" y="160" width="168" height="42" rx="4"/>
  <rect class="band" x="382" y="220" width="168" height="42" rx="4"/>
  <text class="lbl" x="466" y="127" text-anchor="middle">host layer</text>
  <text class="lbl" x="466" y="187" text-anchor="middle">service layer</text>
  <text class="lbl" x="466" y="247" text-anchor="middle">vulnerability layer</text>
  <text class="xref" x="466" y="282" text-anchor="middle">Figure 2.2</text>
</g>

<!-- ============ DEFENCE ============ -->
<g id="defence">
  <rect class="module" x="676" y="30" width="200" height="272" rx="5"/>
  <g transform="translate(704,63)"><use href="#shieldic"/></g>
  <text class="title" x="726" y="71">Defence</text>
  <g class="dot"><circle cx="704" cy="136" r="2.6"/><circle cx="704" cy="196" r="2.6"/></g>
  <text class="lbl" x="720" y="142">execution scheme</text>
  <text class="lbl" x="720" y="202">seven mechanisms</text>
  <text class="xref" x="776" y="282" text-anchor="middle">Figure 2.3</text>
</g>

<!-- ============ the four couplings ============ -->
<!-- attacker reads the network; attacker compromises it -->
<g class="arrow acc">
  <path marker-end="url(#mA)" d="M230,120 H352"/>
  <path marker-end="url(#mA)" d="M230,214 H352"/>
</g>
<text class="verb halo" x="291" y="108" text-anchor="middle" fill="#1f548c">observes</text>
<text class="verb halo" x="291" y="202" text-anchor="middle" fill="#1f548c">compromises</text>

<!-- defence rewrites the network -->
<path class="arrow" marker-end="url(#mI)" d="M672,167 H580"/>
<text class="verb halo" x="626" y="155" text-anchor="middle">rewrites</text>

<!-- the rewrite interrupts the attacker: the loop that closes the model -->
<path class="arrow" marker-end="url(#mI)" d="M776,306 V336 H126 V306"/>
<text class="verb halo" x="451" y="328" text-anchor="middle">interrupts</text>
</svg>
</body></html>
