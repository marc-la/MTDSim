<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fig:attacker-model — the attacker's procedure</title>
<style>
  :root { --ink:#333; --ink2:#6e6e6e; }
  html, body { margin:0; background:#fff; }
  body { width: 900px; }
  @media print { @page { margin:0; } body { width:16.058cm; } }
  svg { display:block; font-family: "Nimbus Sans", "TeX Gyre Heros", Helvetica, Arial, sans-serif; }
  text { fill: var(--ink); }
  .lbl    { font-size: 17px; }
  .nm     { font-size: 17px; font-weight: bold; }
  .sm, .sm text { font-size: 15.5px; fill: var(--ink2); }
  .state  { fill:#fff; stroke: var(--ink); stroke-width:1.8; }
  .step   { stroke: var(--ink2); stroke-width:1.7; fill:none; }
  .cut    { stroke: var(--ink); stroke-width:1.7; fill:none; stroke-dasharray:6 5; }
</style></head>
<body>
<svg id="fig" viewBox="0 0 900 376" width="900" height="376" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker>
  <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>

<!-- where an MTD deployment sends the attacker back to (dash = MTD interrupt, nothing else) -->
<g class="sm" text-anchor="middle">
  <text x="80"  y="22">after a host-layer</text>
  <text x="80"  y="40">deployment</text>
  <text x="450" y="22">after a service-layer</text>
  <text x="450" y="40">deployment</text>
  <text x="635" y="40">after a user shuffle</text>
</g>
<g class="cut">
  <path marker-end="url(#mC)" d="M80,48 V78"/>
  <path marker-end="url(#mC)" d="M450,48 V78"/>
  <path marker-end="url(#mC)" d="M635,48 V78"/>
</g>

<!-- the ordinary advance -->
<g class="step">
  <path marker-end="url(#mS)" d="M150,130 H193"/>   <!-- scan host -> enumerate host -->
  <path marker-end="url(#mS)" d="M335,130 H378"/>   <!-- enumerate host -> scan port -->
  <path marker-end="url(#mS)" d="M520,130 H563"/>   <!-- scan port -> exploit (no credential works) -->
  <path marker-end="url(#mS)" d="M705,130 H748"/>   <!-- exploit -> brute force -->
</g>
<g class="sm" text-anchor="middle">
  <text x="542" y="121">fails</text>
  <text x="727" y="121">fails</text>
</g>

<!-- the returns to enumerate host / scan host -->
<g class="step">
  <path marker-end="url(#mS)" d="M215,180 V208 H80 V182"/>          <!-- enumerate host -> scan host -->
  <path marker-end="url(#mS)" d="M545,300 H320 V182"/>              <!-- scan neighbours -> enumerate host -->
  <path marker-end="url(#mS)" d="M870,180 V366 H265 V182"/>         <!-- brute force -> enumerate host -->
</g>
<text class="sm" x="147" y="226" text-anchor="middle">no host left</text>
<text class="sm" x="862" y="290" text-anchor="end">fails</text>

<!-- the three moves that compromise a host, into scan neighbours -->
<g class="step">
  <path marker-end="url(#mS)" d="M450,180 V216 H595 V248"/>   <!-- scan port -> scan neighbours -->
  <path marker-end="url(#mS)" d="M635,180 V248"/>             <!-- exploit -> scan neighbours -->
  <path marker-end="url(#mS)" d="M820,180 V216 H675 V248"/>   <!-- brute force -> scan neighbours -->
</g>
<g class="sm">
  <text x="442" y="204" text-anchor="end">succeeds</text>
  <text x="643" y="204">succeeds</text>
  <text x="812" y="204" text-anchor="end">succeeds</text>
</g>

<!-- the six phases: name in bold, then what the phase does (attack_operation.py
     _do_scan_host, _do_enum_host, _do_scan_port, _do_exploit_vuln,
     _do_brute_force, _do_scan_neighbors; verified 2026-09-30) -->
<g>
  <rect class="state" x="10"  y="80" width="140" height="100" rx="4"/>
  <text class="nm" x="80"  y="105" text-anchor="middle">scan host</text>
  <text class="sm" x="80"  y="127" text-anchor="middle">lists the visible</text>
  <text class="sm" x="80"  y="145" text-anchor="middle">hosts it has not</text>
  <text class="sm" x="80"  y="163" text-anchor="middle">compromised</text>

  <rect class="state" x="195" y="80" width="140" height="100" rx="4"/>
  <text class="nm" x="265" y="105" text-anchor="middle">enumerate host</text>
  <text class="sm" x="265" y="127" text-anchor="middle">takes the next</text>
  <text class="sm" x="265" y="145" text-anchor="middle">host in the list</text>

  <rect class="state" x="380" y="80" width="140" height="100" rx="4"/>
  <text class="nm" x="450" y="105" text-anchor="middle">scan port</text>
  <text class="sm" x="450" y="127" text-anchor="middle">scans the host's</text>
  <text class="sm" x="450" y="145" text-anchor="middle">ports, then tries</text>
  <text class="sm" x="450" y="163" text-anchor="middle">stolen credentials</text>

  <rect class="state" x="565" y="80" width="140" height="100" rx="4"/>
  <text class="nm" x="635" y="105" text-anchor="middle">exploit</text>
  <text class="sm" x="635" y="127" text-anchor="middle">exploits the</text>
  <text class="sm" x="635" y="145" text-anchor="middle">vulnerabilities by</text>
  <text class="sm" x="635" y="163" text-anchor="middle">return on attack</text>

  <rect class="state" x="750" y="80" width="140" height="100" rx="4"/>
  <text class="nm" x="820" y="105" text-anchor="middle">brute force</text>
  <text class="sm" x="820" y="127" text-anchor="middle">guesses a login</text>
  <text class="sm" x="820" y="145" text-anchor="middle">with stolen</text>
  <text class="sm" x="820" y="163" text-anchor="middle">passwords</text>

  <rect class="state" x="545" y="250" width="180" height="100" rx="4"/>
  <text class="nm" x="635" y="275" text-anchor="middle">scan neighbours</text>
  <text class="sm" x="635" y="297" text-anchor="middle">puts the new host's</text>
  <text class="sm" x="635" y="315" text-anchor="middle">neighbours at the</text>
  <text class="sm" x="635" y="333" text-anchor="middle">front of the list</text>
</g>
</svg>
</body></html>
