<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fig:execution-scheme — the loop the execution scheme runs</title>
<style>
  :root { --ink:#333; --ink2:#6e6e6e; --panel:#f7f7f7; }
  html, body { margin:0; background:#fff; }
  body { width: 900px; }
  @media print { @page { size: 16.058cm 5.35cm; margin:0; } body { width:16.058cm; } }
  svg { display:block; font-family: "Nimbus Sans", "TeX Gyre Heros", Helvetica, Arial, sans-serif; }
  text { fill: var(--ink); }
  .ptitle { font-size: 19px; font-weight: bold; }
  .lbl    { font-size: 17px; }
  .panel  { fill: var(--panel); stroke:none; }
  .icon   { fill:none; stroke: var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .icon.f { fill: var(--ink); stroke:none; }
  .arrow  { stroke: var(--ink); stroke-width:1.8; fill:none; }
  .loop   { stroke: var(--ink2); stroke-width:1.6; fill:none; }
</style></head>
<body>
<svg id="fig" viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="mL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker>
  <g id="clockic"><circle class="icon" r="17"/><path class="icon" d="M0,-10 V0 H7"/></g>
  <g id="diceic"><rect class="icon" x="-12" y="-12" width="24" height="24" rx="3"/><circle class="icon f" cx="-5.5" cy="-5.5" r="2.4"/><circle class="icon f" cx="5.5" cy="5.5" r="2.4"/><circle class="icon f" r="2.4"/></g>
  <g id="chipic"><rect class="icon" x="-11" y="-11" width="22" height="22" rx="2.5"/><path class="icon" d="M-5.5,-11 V-16 M0,-11 V-16 M5.5,-11 V-16 M-5.5,11 V16 M0,11 V16 M5.5,11 V16 M-11,-5.5 H-16 M-11,0 H-16 M-11,5.5 H-16 M11,-5.5 H16 M11,0 H16 M11,5.5 H16"/></g>
  <g id="noneic"><circle class="icon" r="12"/><path class="icon" d="M-8.5,8.5 L8.5,-8.5"/></g>
  <g id="netic"><circle class="icon" cx="-13" cy="-9" r="5.2"/><circle class="icon" cx="13" cy="-9" r="5.2"/><circle class="icon" cx="0" cy="13" r="5.2"/><path class="icon" d="M-8.7,-6.5 L-3.5,10 M8.7,-6.5 L3.5,10 M-7.8,-9 H7.8"/></g>
</defs>

<rect class="panel" x="14" y="14" width="872" height="272" rx="6"/>
<text class="ptitle" x="34" y="46">Execution scheme</text>

<!-- 1. the clock -->
<g transform="translate(140,130)"><use href="#clockic"/></g>
<text class="lbl" x="140" y="188" text-anchor="middle">an interval elapses</text>

<path class="arrow" marker-end="url(#mI)" d="M172,130 H352"/>

<!-- 2. what fires, if anything -->
<g transform="translate(408,130)"><use href="#diceic"/></g>
<g transform="translate(450,130)"><use href="#chipic"/></g>
<g transform="translate(492,130)"><use href="#noneic"/></g>
<text class="lbl" x="450" y="188" text-anchor="middle">the scheme picks which mechanism</text>
<text class="lbl" x="450" y="210" text-anchor="middle">deploys — or none</text>

<path class="arrow" marker-end="url(#mI)" d="M520,130 H700"/>

<!-- 3. what actually moves -->
<g transform="translate(730,130)"><use href="#netic"/></g>
<text class="lbl" x="730" y="188" text-anchor="middle">its rewrite manipulates</text>
<text class="lbl" x="730" y="210" text-anchor="middle">the attack surface</text>

<!-- and the loop closes -->
<path class="loop" marker-end="url(#mL)" d="M788,130 H862 V252 H48 V130 H118"/>
</svg>
</body></html>
