<title>fig:network-model — the host layer, and one host</title>
<style>
  :root {
    --ink:#333; --ink2:#6e6e6e; --faint:#b0b0b0; --faintline:#d2d2d2;
    --chrome:#ececec;
    --accent:#1f548c;                 /* attacker action and path */
    --red:#b3261e; --redfill:#f3d6d3;  /* compromised */
  }
  html, body { margin:0; background:#fff; }
  body { width: 900px; }
  @media print { @page { margin:0; } body { width:16.058cm; } }
  svg { display:block; font-family: "Nimbus Sans", "TeX Gyre Heros", Helvetica, Arial, sans-serif; }
  text { fill: var(--ink); }
  .ptitle { font-size: 19px; font-weight: bold; }
  .lbl    { font-size: 17px; }
  .sm, .sm text { font-size: 15.5px; fill: var(--ink2); }
  .icon   { fill:none; stroke: var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .host   { fill:#fff; stroke: var(--ink); stroke-width:1.7; }
  .target { fill:#fff; stroke: var(--ink); stroke-width:1.6; }  /* inside a scale(1.5): 2.4 px effective */
  .comp   { fill: var(--redfill); stroke: var(--red); stroke-width:2.4; }
  .cable  { stroke:#8a8a8a; stroke-width:1.7; fill:none; }
  .path   { stroke: var(--red); stroke-width:3.2; fill:none; }   /* the attacker's route: compromise red, one colour for one story */
  .group  { fill: var(--chrome); stroke:none; }
  .goal   { fill: var(--chrome); stroke:none; }   /* target hosts: marked by size and the bold label, not a hue */
  .lead   { stroke: var(--ink2); stroke-width:1.3; fill:none; }
  .enter  { stroke: var(--red); stroke-width:2.2; fill:none; }
  .rowbox { fill:#fff; stroke: var(--ink); stroke-width:1.7; }
  .rule   { stroke: var(--faintline); stroke-width:1.3; }
</style></head>
