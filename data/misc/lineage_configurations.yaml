# The configurations the MTDSim lineage evaluated on — the source of
# tab:lineage-configurations (chapter 2, §2.2), emitted by
# tools/ch2_lineage_configurations_table.py.
#
# Why this exists: supervisor ruling E5 (2026-09-22) — "every hard-coded number,
# somebody will ask why that number". A value a prior study ran is the cheapest
# defence, so chapter 5's Table 5.1 points here.
#
# One paper per pass (guardrails). Every value was read from the paper's
# evaluation anatomy in docs/implementation/evaluation_anatomies/<key>.md and
# spot-checked against the converted source in docs/sources/lit_review/<key>.md
# (2026-09-23). The locator is the paper's own (PDF page, table), as the
# anatomy records it. A null value means the study does not state it — the
# absence is recorded, never filled in.
#
# Tay 2024 is deliberately not a column: its anatomy records no network size,
# no interval, no termination rule and no run count (tay2024.md §B). The
# caption says so.
#
# Values are tex-ready (thin spaces, en dashes); semicolons separate the levels
# a study ran, as in Table 5.1.

studies:
  - key: brown2023
    name: Brown
  - key: zhang2023
    name: Zhang
  - key: ho2024
    name: Ho

rows:
  - parameter: Hosts
    brown2023: {value: '200', locator: 'Table I, p.5'}
    zhang2023: {value: '25; 50; 75; 100', locator: 'Table 2, p.33 ("four networks with different sizes, ranging from 25 to 100 nodes")'}
    ho2024: {value: '150', locator: 'Table 2 "Simulator Settings", p.19 (Total Nodes 150; held fixed while Ho''s "network size" varies, p.19)'}

  - parameter: Levels of depth
    brown2023: {value: '5', locator: 'Table I, p.5 ("No. of layers"; levels of depth per p.2)'}
    zhang2023: {value: '4', locator: 'Table 2, p.33 ("Layers", 4 on every network)'}
    ho2024: {value: null, locator: 'not stated: Table 2 (p.19) lists only Start Time, Finish Time, Total Nodes, Static Degrade Factor; the "3-layer HARM" (p.14) is the model''s three graph layers, not levels of depth. The released code (tay2024code) runs a 50-host network, not Ho''s 150, so it cannot stand in  [re-read against the PDF 2026-10-01; the absence holds]'}

  - parameter: Subnets
    brown2023: {value: '20', locator: 'Table I, p.5'}
    zhang2023: {value: null, locator: 'not stated: Table 2 (p.33) has Nodes, Density, Endpoints, Layers only, and the generator (Barabasi-Albert, 4.2.1, p.20) is given no subnet count  [re-read against the PDF 2026-10-01; the absence holds]'}
    ho2024: {value: null, locator: 'not stated: Table 2 (p.19) as for levels of depth  [re-read against the PDF 2026-10-01; the absence holds]'}

  - parameter: Exposed endpoints
    brown2023: {value: '20', locator: 'Table I, p.5 ("No. of exposed hosts")'}
    zhang2023: {value: '3; 5; 7; 10', locator: 'Table 2, p.33 ("Endpoints", one per network)'}
    ho2024: {value: null, locator: 'not stated: Table 2 (p.19) as for levels of depth  [re-read against the PDF 2026-10-01; the absence holds]'}

  - parameter: Attack scenario
    brown2023: {value: 'general; targeted', locator: 'III.C.1, p.4 (Scenario 1, "attempting to compromise the whole network"; Scenario 2, "a specific ''target'' host (e.g., a credential database)"); target at level 3 or 4, figure captions p.6'}
    zhang2023: {value: 'general', locator: '§4.4.1.1, p.28 (only the first scenario refactored)'}
    ho2024: {value: 'general', locator: '§3.1, p.15 ("to try to compromise as many hosts as possible")'}

  # How a run ends: each study's terminating condition, one row (the time
  # limit folded in), so the 80 % reads as Zhang's setting and the general
  # scenario is defined by its goal alone (Table 2.3). Marc, 2026-10-01:
  # "General scenario stop seems vague and forced".
  - parameter: End of run
    brown2023: {value: 'whole network compromised; target host compromised', locator: 'III.C.1, p.4 (Scenario 1 "attempting to compromise the whole network"; Scenario 2 the target); no time limit stated (brown2023.md §B)'}
    zhang2023: {value: '80\,\% of the hosts compromised', locator: 'p.33 ("the terminating condition for the simulation as the NCR reaching 0.8"); no time limit stated'}
    ho2024: {value: 'time limit of 15\,000\,s', locator: 'Table 2, p.19 (Finish Time 15000; no unit given, read as seconds: Ho ran Zhang''s MTDSimTime (p.14), whose clock counts seconds (zhang2023 p.32, Table 3), and the code compares times against env.now; Ho''s one unit label, "Static Degrade Factor 2000(ms)", is a slip, the code''s 2000 being on the same seconds clock); no compromise threshold stated ("as many hosts as possible", §3.1, p.15)'}

  - parameter: Deployment interval
    brown2023: {value: 'uniform on 1--5\,s', locator: 'given in ms (1\,000--5\,000); Table I, p.5; §IV, p.5 ("E(T) = 3000 (time in milliseconds)")'}
    zhang2023: {value: 'exponential, mean 50; 100; 150; 200\,s', locator: 'p.33 ("four MTD Intervals, ranging from 50 to 200 seconds"); levels from the Figure 8 panel titles, p.35; exponential, §4.3.4, p.27'}
    ho2024: {value: '50; 100; 200\,s', locator: 'Table 6, p.23 (no unit given, read as seconds as for the time limit); comparison with the execution schemes at 200, Table 8, p.24'}

  # Deployment duration CUT 2026-10-01 (Marc: "is that necessary in 2.4?"):
  # only Zhang states it, and nothing points to the row --- 2.2.2 gives the
  # range and Table 5.1 the four values, each citing Zhang directly. Brown's
  # simulator modelled none ("disregarding the execution time of MTD
  # operations", zhang2023 p.15); Ho states none.

  - parameter: Runs per configuration
    brown2023: {value: null, locator: 'not stated: Figures 4-5 report totals and averages with no trial count, and Table I (p.5) has none  [re-read against the PDF 2026-10-01; the absence holds]'}
    zhang2023: {value: '100', locator: 'p.33 ("run the simulation 100 times for each variable set")'}
    ho2024: {value: null, locator: 'not stated: 3.4.1 (p.24) takes "the median of the trials" without their number; the 100 of Table 1 is training episodes, not evaluation runs  [re-read against the PDF 2026-10-01; the absence holds]'}
