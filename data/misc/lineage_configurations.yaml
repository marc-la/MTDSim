# The configurations the MTDSim lineage evaluated on — the source of
# tab:lineage-configurations (chapter 2, §2.2), emitted by
# tools/ch2_lineage_configurations_table.py.
#
# Why this exists: supervisor ruling E5 (2026-09-22) — "every hard-coded number,
# somebody will ask why that number". A value a prior study ran is the cheapest
# defence, so chapter 5's Table 5.1 points here.
#
# One paper per pass (guardrails). Every value was read from the paper's
# evaluation anatomy in docs/implementation/evaluation_anatomies/<key>.md and
# spot-checked against the converted source in docs/sources/lit_review/<key>.md
# (2026-09-23). The locator is the paper's own (PDF page, table), as the
# anatomy records it. A null value means the study does not state it — the
# absence is recorded, never filled in.
#
# Tay 2024 is deliberately not a column: its anatomy records no network size,
# no interval, no termination rule and no run count (tay2024.md §B). The
# caption says so.
#
# Values are tex-ready (thin spaces, en dashes); semicolons separate the levels
# a study ran, as in Table 5.1.

studies:
  - key: brown2023
    name: Brown
  - key: zhang2023
    name: Zhang
  - key: ho2024
    name: Ho

rows:
  - parameter: Hosts
    brown2023: {value: '200', locator: 'Table I, p.5'}
    zhang2023: {value: '25; 50; 75; 100', locator: 'Table 2, p.33 ("four networks with different sizes, ranging from 25 to 100 nodes")'}
    ho2024: {value: '150', locator: 'Table 2 "Simulator Settings", p.19 (Total Nodes 150; held fixed while Ho''s "network size" varies, p.19)'}

  - parameter: Levels of depth
    brown2023: {value: '5', locator: 'Table I, p.5 ("No. of layers"; levels of depth per p.2)'}
    zhang2023: {value: '4', locator: 'Table 2, p.33 ("Layers", 4 on every network)'}
    ho2024: {value: null, locator: 'not stated (ho2024.md §B)'}

  - parameter: Subnets
    brown2023: {value: '20', locator: 'Table I, p.5'}
    zhang2023: {value: null, locator: 'not stated; Table 2 carries no subnet column'}
    ho2024: {value: null, locator: 'not stated (ho2024.md §B)'}

  - parameter: Exposed endpoints
    brown2023: {value: '20', locator: 'Table I, p.5 ("No. of exposed hosts")'}
    zhang2023: {value: '3; 5; 7; 10', locator: 'Table 2, p.33 ("Endpoints", one per network)'}
    ho2024: {value: null, locator: 'not stated (ho2024.md §B)'}

  - parameter: Attack scenario
    brown2023: {value: 'general; targeted, a database host', locator: 'III.C.1, p.4 (Scenario 1; Scenario 2, "a specific ''target'' host (e.g., a credential database)"); target at level 3 or 4, figure captions p.6'}
    zhang2023: {value: 'general', locator: '§4.4.1.1, p.28 (only the first scenario refactored)'}
    ho2024: {value: 'general', locator: '§3.1, p.15 ("to try to compromise as many hosts as possible")'}

  - parameter: Deployment interval
    brown2023: {value: 'uniform on 1\,000--5\,000\,ms', locator: 'Table I, p.5; §IV, p.5 ("E(T) = 3000 (time in milliseconds)")'}
    zhang2023: {value: 'exponential, mean 50; 100; 150; 200\,s', locator: 'p.33 ("four MTD Intervals, ranging from 50 to 200 seconds"); levels from the Figure 8 panel titles, p.35; exponential, §4.3.4, p.27'}
    ho2024: {value: '50; 100; 200', locator: 'Table 6, p.23 (no unit given); comparison with the execution schemes at 200, Table 8, p.24'}

  - parameter: Deployment duration
    brown2023: {value: null, locator: 'not stated (provenance.md, IS-TIM-03)'}
    zhang2023: {value: 'complete topology shuffle 110\,s, IP shuffle 100\,s, OS diversity 80\,s, optimised OS assignment 80\,s, service diversity 70\,s', locator: 'Table 3 "MTD Execution Time", p.34 (standard deviation 0.5 on each)'}
    ho2024: {value: null, locator: 'not stated (ho2024.md §B)'}

  - parameter: Run ends
    brown2023: {value: 'attack goal met', locator: 'III.C.1, p.4; no time limit stated (brown2023.md §B)'}
    zhang2023: {value: '80\,\% of hosts compromised', locator: 'p.33 ("the terminating condition for the simulation as the NCR reaching 0.8")'}
    ho2024: {value: '15\,000', locator: 'Table 2, p.19 (Finish Time 15000; no unit given)'}

  - parameter: Runs per configuration
    brown2023: {value: null, locator: 'not stated (brown2023.md §B)'}
    zhang2023: {value: '100', locator: 'p.33 ("run the simulation 100 times for each variable set")'}
    ho2024: {value: null, locator: 'not stated; the 100 of Table 1 is training episodes, not evaluation runs (ho2024.md §B)'}
